[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gncbench"
version = "0.1.0"
description = "GNC-in-the-loop test bench for a quadcopter (MEC McGill)"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]
logs = ["pyulog"]      # only to read real PX4 flight logs (step 4)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
